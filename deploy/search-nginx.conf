server {
    listen 80;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
    location /api/search {
        proxy_pass http://search-gateway:8788;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 200s;
        client_max_body_size 64k;
    }
}
